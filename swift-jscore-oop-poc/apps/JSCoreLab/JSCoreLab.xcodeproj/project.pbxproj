			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\n\n# The helper is a plain executable built by SwiftPM at the POC root, not by this\n# project. It is copied in and signed with its own entitlements here, before the\n# app is sealed around it — App Sandbox plus allow-jit, which is the pair E5 found\n# the JIT actually hinges on.\n#\n# --timestamp is not optional: notarization rejects a signature without one, and\n# E11 exists to put this through notarization.\nPOC_ROOT=\"${SRCROOT}/../..\"\n\ncd \"${POC_ROOT}\"\nswift build -c release --product PluginHelperDevID\n\n# PluginHelperDevID, not PluginHelper: same code under its own bundle identifier,\n# so its App Sandbox container is separate from the ad-hoc variants' and the two\n# signing identities never contend for one container.\nHELPER_DST=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/PluginHelper\"\ncp \"${POC_ROOT}/.build/release/PluginHelperDevID\" \"${HELPER_DST}\"\n\ncodesign --force \\\n  --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \\\n  --options runtime \\\n  --entitlements \"${POC_ROOT}/SandboxJIT.entitlements\" \\\n  --timestamp \\\n  \"${HELPER_DST}\"\n";
		};
/* End PBXShellScriptBuildPhase section */

