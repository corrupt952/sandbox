<!--
  Probe 1: features that a lightweight rasterizer may silently drop.
  - <marker> referenced via marker-end (sips drops it, no warning)
  - linearGradient
  - feGaussianBlur filter
  - Japanese text with and without an explicit font-family
  Note: the root <svg> deliberately has NO font-family, to expose the
  default-font fallback of each renderer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#d94a90"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="480" height="200" fill="#fff"/>
  <rect x="20" y="30" width="120" height="50" rx="6" fill="url(#grad)"/>
  <circle cx="420" cy="55" r="22" fill="#999" filter="url(#blur)"/>

  <line x1="150" y1="55" x2="380" y2="55" stroke="#333" stroke-width="2"
        marker-end="url(#arrow)"/>

  <text x="20" y="120" font-size="16">日本語テキスト font-family なし</text>
  <text x="20" y="150" font-size="16" font-family="Hiragino Sans">日本語テキスト font-family あり</text>
  <text x="20" y="180" font-size="14">ABC abc 0123 — 長い文字列のはみ出し確認用テキストです</text>
</svg>
